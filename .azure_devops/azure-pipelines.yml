# Azure DevOps pipeline for deploying Azure infrastructure and Fabric items.
#
# Prerequisites in Azure DevOps:
#   1. Service connection `Azure-Service-Connection` (Azure Resource Manager) with 
#      Contributor access to the Azure subscription for infrastructure deployment.
#   2. Service connection `spn-main-fabric-deploy` (Azure Resource Manager, workload identity 
#      federation recommended) with access to Fabric workspaces.
#   3. Environments configured with approval checks where required (typically tst + prd):
#      - fabric-tst, fabric-prd (for Fabric deployments)
#
# Note: Workspace IDs are read from lakehouse_solution.yml (updated by setup_workspaces.py).
#       No variable groups needed for WORKSPACE_ID - it's managed in the repository.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - solution/*
      - infrastructure/*
      - scripts/*
      - requirements-deploy.txt
      - .azure_devops/*

pr: none

parameters:
  # Workspace selection
  - name: workspaces
    displayName: Workspaces to Deploy
    type: object
    default:
      - name: ingestion
        displayName: Ingestion
        deploy: true
      - name: lakehouse_processing
        displayName: Lakehouse Processing
        deploy: true
      - name: lakehouse
        displayName: Lakehouse
        deploy: true

  # Environment configuration
  - name: environments
    displayName: Environments
    type: object
    default:
      - name: dev
        displayName: DEV
        deploy: true
        requiresApproval: false
        dependsOn: []
        infraDependsOn: []
      - name: tst
        displayName: TST
        deploy: true
        requiresApproval: true
        dependsOn:
          - deploy_dev
        infraDependsOn: []  # Parallel infrastructure
      - name: prd
        displayName: PRD
        deploy: true
        requiresApproval: true
        dependsOn:
          - deploy_tst
        infraDependsOn: []  # Parallel infrastructure

variables:
  pythonVersion: "3.12"
  azureServiceConnection: "spn-main-fabric-deploy"
  azureInfraServiceConnection: "Azure-Service-Connection"

stages:
  # Deploy Azure infrastructure (Key Vault, etc.)
  - ${{ each env in parameters.environments }}:
    - template: templates/deploy-infrastructure-stage.yml
      parameters:
        environment: ${{ env }}
        azureInfraServiceConnection: $(azureInfraServiceConnection)

  # Setup workspaces and update lakehouse_solution.yml
  - template: templates/setup-workspaces-stage.yml
    parameters:
      environments: ${{ parameters.environments }}
      pythonVersion: $(pythonVersion)
      azureServiceConnection: $(azureServiceConnection)
  
  # Deploy Fabric items to each environment
  - ${{ each env in parameters.environments }}:
    - template: templates/deploy-fabric-stage.yml
      parameters:
        environment: ${{ env }}
        workspaces: ${{ parameters.workspaces }}
