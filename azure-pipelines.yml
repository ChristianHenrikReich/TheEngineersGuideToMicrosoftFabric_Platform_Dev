# Azure DevOps pipeline for deploying Fabric items via fabric-cicd.
#
# Prerequisites in Azure DevOps:
#   1. A service connection (Azure Resource Manager, workload identity federation
#      recommended) named `spn-main-fabric-deploy` with the service principal that has
#      access to the Fabric workspaces.
#   2. Variable groups for each workspace-environment combination:
#         - fabric-ingestion-dev, fabric-ingestion-tst, fabric-ingestion-prd
#         - fabric-lakehouse-dev, fabric-lakehouse-tst, fabric-lakehouse-prd
#         - fabric-processing-dev, fabric-processing-tst, fabric-processing-prd
#      Each with: WORKSPACE_ID (the target Fabric workspace GUID)
#   3. Environments configured with approval checks where required (typically tst + prd).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - solution/*
      - deploy.py
      - requirements-deploy.txt
      - azure-pipelines.yml

pr: none

parameters:
  # Workspace selection
  - name: workspaces
    displayName: Workspaces to Deploy
    type: object
    default:
      - name: ingestion
        displayName: Ingestion
        deploy: true
      - name: lakehouse_processing
        displayName: Lakehouse Processing
        deploy: true
      - name: lakehouse
        displayName: Lakehouse
        deploy: true

  # Environment configuration
  - name: environments
    displayName: Environments
    type: object
    default:
      - name: dev
        displayName: DEV
        deploy: true
        requiresApproval: false
        dependsOn: []
      - name: tst
        displayName: TST
        deploy: false
        requiresApproval: true
        dependsOn:
          - deploy_dev
      - name: prd
        displayName: PRD
        deploy: false
        requiresApproval: true
        dependsOn:
          - deploy_tst

variables:
  pythonVersion: "3.12"
  azureServiceConnection: "spn-main-fabric-deploy"

stages:
  # Loop over each environment
  - ${{ each env in parameters.environments }}:
    - stage: deploy_${{ env.name }}
      displayName: Deploy to ${{ env.displayName }}
      condition: eq('${{ env.deploy }}', 'True')
      dependsOn: ${{ env.dependsOn }}
      jobs:
        # Loop over each workspace
        - ${{ each workspace in parameters.workspaces }}:
          - ${{ if eq(workspace.deploy, true) }}:
            # DEV uses regular jobs, TST/PRD use deployment jobs with approval gates
            - ${{ if eq(env.requiresApproval, false) }}:
              - job: deploy_${{ workspace.name }}_${{ env.name }}
                displayName: Deploy ${{ workspace.displayName }}
                pool:
                  vmImage: ubuntu-latest
                variables:
                  - group: fabric-${{ workspace.name }}-${{ env.name }}
                steps:
                  - template: templates/deploy-workspace.yml
                    parameters:
                      workspace: ${{ workspace.name }}
                      environment: ${{ env.name }}
                      workspaceId: $(WORKSPACE_ID)
            
            - ${{ if eq(env.requiresApproval, true) }}:
              - deployment: deploy_${{ workspace.name }}_${{ env.name }}
                displayName: Deploy ${{ workspace.displayName }}
                environment: fabric-${{ env.name }}
                pool:
                  vmImage: ubuntu-latest
                variables:
                  - group: fabric-${{ workspace.name }}-${{ env.name }}
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - template: templates/deploy-workspace.yml
                          parameters:
                            workspace: ${{ workspace.name }}
                            environment: ${{ env.name }}
                            workspaceId: $(WORKSPACE_ID)
